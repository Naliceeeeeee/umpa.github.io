<script>
(function () {
  function getQueryParam(name) {
    try {
      var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
    } catch (e) {
      return null;
    }
  }

  function readStorage(key, fallback) {
    try {
      return localStorage.getItem(key) || fallback;
    } catch (e) {
      return fallback;
    }
  }

  var stored = getQueryParam('umpa-theme') || readStorage('umpa-theme', 'default');
  var legacy = { light: 'default', dark: 'black', contrast: 'default' };
  var valid = { default: 1, green: 1, red: 1, black: 1 };
  var theme = valid[stored] ? stored : (legacy[stored] || 'default');
  var font = getQueryParam('umpa-font') || readStorage('umpa-font', 'poppins');
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-font', font);
})();
</script>
