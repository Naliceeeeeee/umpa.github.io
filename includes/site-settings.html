<!-- SITE SETTINGS (theme & font) -->
<div class="site-settings" id="siteSettings">
  <button type="button" class="site-settings-toggle" id="siteSettingsToggle" aria-label="Open display settings" aria-expanded="false" aria-controls="siteSettingsPanel">
    <i class="fa-solid fa-gear" aria-hidden="true"></i>
  </button>
  <div class="site-settings-backdrop" id="siteSettingsBackdrop" hidden></div>
  <aside class="site-settings-panel" id="siteSettingsPanel" role="dialog" aria-labelledby="siteSettingsTitle" aria-modal="true" hidden>
    <header class="site-settings-header">
      <div class="site-settings-header-text">
        <span class="site-settings-header-icon" aria-hidden="true"><i class="fa-solid fa-palette"></i></span>
        <div>
          <h2 id="siteSettingsTitle">Display Settings</h2>
          <p>Site opens in UMPA Classic. Choose green, red, or black when you like.</p>
        </div>
      </div>
      <button type="button" class="site-settings-close" id="siteSettingsClose" aria-label="Close settings">
        <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
      </button>
    </header>
    <div class="site-settings-body">
      <fieldset class="site-settings-field">
        <legend><i class="fa-solid fa-swatchbook" aria-hidden="true"></i> Color theme</legend>
        <p class="site-settings-hint">Default is the full UMPA look. Pick one color to restyle the site.</p>
        <div class="site-settings-grid site-settings-grid--themes" role="radiogroup" aria-label="Color theme">
          <label class="site-settings-tile">
            <input type="radio" name="umpa-theme" value="default" checked />
            <span class="site-settings-tile-icon site-settings-tile-icon--default" aria-hidden="true"><i class="fa-solid fa-landmark"></i></span>
            <span class="site-settings-tile-label">UMPA Classic</span>
          </label>
          <label class="site-settings-tile">
            <input type="radio" name="umpa-theme" value="green" />
            <span class="site-settings-tile-icon site-settings-tile-icon--green" aria-hidden="true"><i class="fa-solid fa-leaf"></i></span>
            <span class="site-settings-tile-label">Green</span>
          </label>
          <label class="site-settings-tile">
            <input type="radio" name="umpa-theme" value="red" />
            <span class="site-settings-tile-icon site-settings-tile-icon--red" aria-hidden="true"><i class="fa-solid fa-heart"></i></span>
            <span class="site-settings-tile-label">Red</span>
          </label>
          <label class="site-settings-tile">
            <input type="radio" name="umpa-theme" value="black" />
            <span class="site-settings-tile-icon site-settings-tile-icon--black" aria-hidden="true"><i class="fa-solid fa-moon"></i></span>
            <span class="site-settings-tile-label">Black</span>
          </label>
        </div>
      </fieldset>
      <fieldset class="site-settings-field">
        <legend><i class="fa-solid fa-font" aria-hidden="true"></i> Font style</legend>
        <div class="site-settings-grid site-settings-grid--fonts" role="radiogroup" aria-label="Font style">
          <label class="site-settings-tile site-settings-tile--font">
            <input type="radio" name="umpa-font" value="poppins" checked />
            <span class="site-settings-font-preview" style="font-family: 'Poppins', sans-serif" aria-hidden="true">Aa</span>
            <span class="site-settings-tile-label">Poppins</span>
          </label>
          <label class="site-settings-tile site-settings-tile--font">
            <input type="radio" name="umpa-font" value="inter" />
            <span class="site-settings-font-preview" style="font-family: 'Inter', sans-serif" aria-hidden="true">Aa</span>
            <span class="site-settings-tile-label">Inter</span>
          </label>
          <label class="site-settings-tile site-settings-tile--font">
            <input type="radio" name="umpa-font" value="open-sans" />
            <span class="site-settings-font-preview" style="font-family: 'Open Sans', sans-serif" aria-hidden="true">Aa</span>
            <span class="site-settings-tile-label">Open Sans</span>
          </label>
          <label class="site-settings-tile site-settings-tile--font">
            <input type="radio" name="umpa-font" value="lora" />
            <span class="site-settings-font-preview" style="font-family: 'Lora', serif" aria-hidden="true">Aa</span>
            <span class="site-settings-tile-label">Lora</span>
          </label>
          <label class="site-settings-tile site-settings-tile--font site-settings-tile--wide">
            <input type="radio" name="umpa-font" value="merriweather" />
            <span class="site-settings-font-preview" style="font-family: 'Merriweather', serif" aria-hidden="true">Aa</span>
            <span class="site-settings-tile-label">Merriweather</span>
          </label>
        </div>
        <select id="umpaFontSelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
          <option value="poppins">Poppins</option>
          <option value="inter">Inter</option>
          <option value="open-sans">Open Sans</option>
          <option value="lora">Lora</option>
          <option value="merriweather">Merriweather</option>
        </select>
      </fieldset>
      <button type="button" class="site-settings-reset" id="siteSettingsReset">
        <i class="fa-solid fa-arrow-rotate-left" aria-hidden="true"></i>
        Reset to defaults
      </button>
    </div>
  </aside>
</div>
