<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Admin login for UMPA content management.">
<title>Admin Login | UMPA</title>
<link rel="shortcut icon" href="./Assets/images/logo.png" type="img/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
(function () {
  var stored = localStorage.getItem('umpa-theme') || 'default';
  var legacy = { light: 'default', dark: 'black', contrast: 'default' };
  var valid = { default: 1, green: 1, red: 1, black: 1 };
  var theme = valid[stored] ? stored : (legacy[stored] || 'default');
  var font = localStorage.getItem('umpa-font') || 'poppins';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-font', font);
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-auth-page">
  <main class="admin-auth-main">
    <section class="admin-auth-card">
      <p class="admin-auth-eyebrow">UMPA Admin</p>
      <h1>Login</h1>
      <p class="admin-auth-subtext">Sign in to manage Programs, Events, Gallery, and Resources.</p>

      <form id="adminLoginForm" class="admin-auth-form" autocomplete="off">
        <label>
          Username
          <input type="text" id="adminUsername" name="username" required />
        </label>
        <label>
          Password
          <input type="password" id="adminPassword" name="password" required />
        </label>
        <button type="submit" class="btn-primary">Login</button>
        <p id="adminLoginError" class="admin-auth-error" hidden>Invalid username or password.</p>
      </form>

      <p class="admin-auth-link"><a href="index.html">Back to website</a></p>
    </section>
  </main>
  <script src="js/script.js" defer></script>
</body>
</html>
